      inference_output_path: "abfss://gold@azsaepmnpdatalakeg2.dfs.core.windows.net/Midas_agent_inference/uat"
      endpoint_workload_size: Medium
      endpoint_scale_to_zero_enabled: false
      agent_llm_timeout_seconds: 60
      agent_max_iterations: 10
      db_user: SQL_EPMBOTPD05
      db_dsn: "epm-to34.corp.epm.com.co:1521/SFUAT"
      oracle_secret_scope: AZ-SecretScopeDBKS-EPM-NP-KV-DLLO
      db_password_secret_key: AZ-SECRET-EPM-BOTPD05-FACTURACION-CTATECNICA
    resources:
      jobs:
        midas_load_transform_data:
          permissions:
            - level: CAN_MANAGE
              service_principal_name: ${var.pipeline_sp}
            - level: CAN_MANAGE
              user_name: frans.taboada@epm.com.co
        midas_agent_deploy_ops:
          permissions:
            - level: CAN_MANAGE
              service_principal_name: ${var.pipeline_sp}
            - level: CAN_MANAGE
              user_name: frans.taboada@epm.com.co
        midas_agent_inference:
          permissions:
            - level: CAN_MANAGE
              service_principal_name: ${var.pipeline_sp}
            - level: CAN_MANAGE
              user_name: frans.taboada@epm.com.co

  # -------------------- PRODUCCIÓN (PROD) --------------------
