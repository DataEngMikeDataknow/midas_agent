      schema_name: facturacion
      source_catalog: epm_datalake_vol_prod
      source_schema: facturacion_vol
      source_volume: facturacion_bronze_vol
      source_base_path: midas_agent
      endpoint_name: agente_ordenes_calidad_prod
      experiment_path: /Users/1db15634-31b7-4f92-a976-fc8920216152/midas_agent_experiment_prod
      pipeline_sp: 1db15634-31b7-4f92-a976-fc8920216152
      endpoint_manager_user: frans.taboada@epm.com.co
      inference_output_path: "abfss://gold@azsaepmproddatalakeg2.dfs.core.windows.net/facturacion/Midas_agent_inference/prod"
      endpoint_workload_size: Medium
      endpoint_scale_to_zero_enabled: false
      agent_llm_timeout_seconds: 60
      agent_max_iterations: 10
      db_user: SQL_EPMBOTPD05
      db_dsn: "epm-po34.corp.epm.com.co:1522/SFPDN"
      oracle_secret_scope: AZ-SecretScopeDBKS-EPM-PROD
      db_password_secret_key: AZ-SECRET-EPM-BOTPD05-FACTURACION-CTATECNICA

# -----------------------------------------------------------------------------
# CONFIGURACIÓN DEL CLUSTER COMPARTIDO POR LOS JOBS
# Specs tomados del cluster DEV (0722-211855-e1a090ph):
#   spark_version: 16.4.x-scala2.12 | node: Standard_DS4_v2 | USER_ISOLATION
# Se usa new_cluster (en lugar de existing_cluster_id) para soportar UAT/Prod
# donde el SP crea el cluster automáticamente. En DEV también se crea nuevo
# cluster por job run (sin depender de un cluster specific encendido).
# -----------------------------------------------------------------------------
_job_cluster: &job_cluster
  job_cluster_key: midas_cluster
  new_cluster:
    spark_version: "16.4.x-scala2.12"
    node_type_id: Standard_DS4_v2
    data_security_mode: USER_ISOLATION
    num_workers: 2

# -----------------------------------------------------------------------------
# RECURSOS (JOBS)
# -----------------------------------------------------------------------------
resources:
  jobs:
    # JOB 1: CARGA DE DATOS, TRANSFORMACIÓN Y CREACIÓN DE FUNCIONES SQL
    midas_load_transform_data:
      name: midas_load_transform_data
      permissions:
        - level: CAN_MANAGE
          service_principal_name: ${var.pipeline_sp}
      email_notifications:
        on_success:
          - jonatan.londono@epm.com.co
        on_failure:
          - jonatan.londono@epm.com.co
      job_clusters:
        - *job_cluster
      tasks:
        - task_key: extraer_datos_oracle
          job_cluster_key: midas_cluster
          libraries:
            - pypi:
                package: oracledb
            - pypi:
                package: tqdm
          spark_python_task:
            python_file: ./src/midas/main_data_fetcher.py
            parameters:
              - "--db_user"
              - "${var.db_user}"
              - "--db_dsn"
              - "${var.db_dsn}"
              - "--secret_scope"
              - "${var.oracle_secret_scope}"
              - "--db_password_secret_key"
              - "${var.db_password_secret_key}"
              - "--output_path"
              - "/Volumes/${var.source_catalog}/${var.source_schema}/${var.source_volume}/${var.source_base_path}"

        - task_key: actualizar_ordenes_calidad
          depends_on:
            - task_key: extraer_datos_oracle
          job_cluster_key: midas_cluster
          spark_python_task:
            python_file: ./src/midas/main_ingestion.py
            parameters:
              - "--source_catalog"
              - "${var.source_catalog}"
              - "--source_schema"
              - "${var.source_schema}"
              - "--source_volume"
              - "${var.source_volume}"
              - "--source_base_path"
              - "${var.source_base_path}"
              - "--destination_catalog"
              - "${var.catalog_name}"
              - "--destination_schema"
              - "${var.schema_name}"

        - task_key: bronze_to_silver
          depends_on:
            - task_key: actualizar_ordenes_calidad
          job_cluster_key: midas_cluster
          spark_python_task:
            python_file: ./src/midas/main_transform.py
            parameters:
              - "--catalog"
              - "${var.catalog_name}"
              - "--schema"
              - "${var.schema_name}"

        - task_key: create_sql_functions
          depends_on:
            - task_key: bronze_to_silver
          job_cluster_key: midas_cluster
          spark_python_task:
            python_file: ./src/midas/main_tools.py
            parameters:
              - "--catalog"
              - "${var.catalog_name}"
              - "--schema"
              - "${var.schema_name}"
              - "--pipeline_sp"
              - "${var.pipeline_sp}"

        - task_key: trigger_inference
          depends_on:
            - task_key: create_sql_functions
          run_job_task:
            job_id: ${resources.jobs.midas_agent_inference.id}

      schedule:
        quartz_cron_expression: "0 30 8 * * ?"
        timezone_id: "America/Bogota"
        pause_status: UNPAUSED
      tags:
        Area: Facturación
        Gerencia: Gerencia experiacia usuario cliente
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED

    # JOB 2: MLOPS - DESPLIEGUE DEL AGENTE
    midas_agent_deploy_ops:
      name: midas_agent_deploy_ops
      permissions:
        - level: CAN_MANAGE
          service_principal_name: ${var.pipeline_sp}
      email_notifications:
        on_success:
          - jonatan.londono@epm.com.co
        on_failure:
          - jonatan.londono@epm.com.co
      job_clusters:
        - *job_cluster
      tasks:
        - task_key: create_sql_functions
          job_cluster_key: midas_cluster
          spark_python_task:
            python_file: ./src/midas/main_tools.py
            parameters:
              - "--catalog"
              - "${var.catalog_name}"
              - "--schema"
              - "${var.schema_name}"
              - "--pipeline_sp"
              - "${var.pipeline_sp}"

        - task_key: deploy_agent_version
          depends_on:
            - task_key: create_sql_functions
          job_cluster_key: midas_cluster
          spark_python_task:
            python_file: ./src/midas/main_deploy.py
            parameters:
              - "--catalog"
              - "${var.catalog_name}"
              - "--schema"
              - "${var.schema_name}"
              - "--model_name"
              - "midas_agent_model"
              - "--endpoint_name"
              - "${var.endpoint_name}"
              - "--experiment_path"
              - "${var.experiment_path}"
              - "--endpoint_workload_size"
              - "${var.endpoint_workload_size}"
              - "--endpoint_scale_to_zero_enabled"
              - "${var.endpoint_scale_to_zero_enabled}"
              - "--agent_llm_timeout_seconds"
              - "${var.agent_llm_timeout_seconds}"
              - "--agent_max_iterations"
              - "${var.agent_max_iterations}"
              - "--pipeline_sp"
              - "${var.pipeline_sp}"
        - task_key: grant_endpoint_permissions
          depends_on:
            - task_key: deploy_agent_version
          job_cluster_key: midas_cluster
          spark_python_task:
            python_file: ./src/midas/main_endpoint_permissions.py
            parameters:
              - "--endpoint_name"
              - "${var.endpoint_name}"
              - "--endpoint_manager_user"
              - "${var.endpoint_manager_user}"
      # Sin schedule: este job lo dispara el pipeline de Azure DevOps
      # automáticamente tras cada bundle deploy (databricks bundle run).
      tags:
        Area: Facturación
        Tipo: LLMOps

    # JOB 3: INFERENCIA BATCH DEL AGENTE
    midas_agent_inference:
      name: midas_agent_inference
      permissions:
        - level: CAN_MANAGE
          service_principal_name: ${var.pipeline_sp}
      email_notifications:
        on_success:
          - jonatan.londono@epm.com.co
        on_failure:
          - jonatan.londono@epm.com.co
      job_clusters:
        - *job_cluster
      tasks:
        - task_key: batch_inference
          job_cluster_key: midas_cluster
          spark_python_task:
            python_file: ./src/midas/main_inference.py
            parameters:
              - "--catalog"
              - "${var.catalog_name}"
              - "--schema"
              - "${var.schema_name}"
              - "--model_endpoint"
              - "${var.endpoint_name}"
              - "--activity_filter"
              - "1019 - DIFERENCIA ACUEDUCTO Y ALCANTARILLADO"
              - "--request_timeout_seconds"
              - "60"
              - "--max_retries"
              - "3"
              - "--source_table"
              - "midas_ordenes_calidad_pendientes_silver"
              - "--target_table"
              - "midas_predicciones_agente_gold"
              - "--output_path"
              - "${var.inference_output_path}"
      tags:
        Area: Facturación
        Tipo: LLMOps
