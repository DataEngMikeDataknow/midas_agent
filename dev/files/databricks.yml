bundle:
  name: midas_agent

# -----------------------------------------------------------------------------
# DEFINICIÓN DE VARIABLES GLOBALES (DECLARACIÓN OBLIGATORIA)
# -----------------------------------------------------------------------------
variables:
  catalog_name:
    description: Catálogo de Unity Catalog
    default: epm_datalabs_catalog_dllo
  schema_name:
    description: Esquema de base de datos
    default: facturacion
  endpoint_name:
    description: Nombre del Endpoint de Serving donde se desplegará el agente
  experiment_path:
    description: Ruta completa de MLflow donde se registrarán las corridas
  source_catalog:
    description: Catálogo de Unity Catalog donde se encuentran los datos fuente
  source_schema:
    description: Esquema de base de datos donde se encuentran los datos fuente
  source_volume:
    description: Volumen de datos donde se encuentran los datos fuente
  source_base_path:
    description: Ruta base dentro del volumen de datos donde se encuentran los datos fuente
  pipeline_sp:
    description: Application ID del Service Principal que ejecuta el deploy en cada ambiente
  endpoint_manager_user:
    description: Usuario que debe quedar con permisos CAN_MANAGE sobre el serving endpoint
  inference_output_path:
    description: Ruta ABFSS del External Location gold donde se publica el CSV de inferencia
  endpoint_workload_size:
    description: Tamaño del workload del serving endpoint
  endpoint_scale_to_zero_enabled:
    description: Indica si el serving endpoint puede escalar a cero
  agent_llm_timeout_seconds:
    description: Timeout interno para llamadas del agente al endpoint LLM
  agent_max_iterations:
    description: Máximo de iteraciones de tool-calling del agente
  db_user:
    description: Usuario de conexión a la base de datos Oracle
  db_dsn:
    description: DSN de conexión Oracle (host:puerto/servicio)
  oracle_secret_scope:
    description: Databricks Secret Scope que contiene la contraseña de Oracle
  db_password_secret_key:
    description: Nombre de la clave en el Secret Scope que almacena la contraseña de Oracle

targets:
  # -------------------- DESARROLLO (DEV) --------------------
  dev:
    mode: production
    default: true
    workspace:
      host: https://adb-1161217326944529.9.azuredatabricks.net
      root_path: /Shared/bundles/${bundle.name}/${bundle.target}
    # Service Principal que ejecuta los Jobs en Dev.
    # APP-ID tomado de la variable DEV_AZURE_SP_APPLICATION_ID del variable group databricks-MIDAS.
    # El pipeline CI/CD deploya autenticado como este mismo SP → puede asignarse a sí mismo como run_as.
    # Deploy manual por usuario dev fallará si el usuario no tiene rol servicePrincipal.user en Azure AD.
    # run_as comentado para permitir deploy manual (jobs corren como el usuario que deploya).
    # Descomentar cuando el pipeline CI/CD esté configurado correctamente.
    # run_as:
    #   service_principal_name: f36901fa-aa2a-47b1-9f1e-0d2553e79a6d
    variables:
      catalog_name: epm_datalabs_catalog_dllo
      schema_name: facturacion
      source_catalog: epm_datalake_vol_np
      source_schema: facturacion_vol
      source_volume: facturacion_bronze_vol
      source_base_path: midas_agent
      endpoint_name: agente_ordenes_calidad_dev_v3
      experiment_path: /Users/ssuarecr@contratista.epm.co/midas_agent_experiment
      pipeline_sp: 2080d313-3074-4adf-8265-916ef7645dc2
      endpoint_manager_user: frans.taboada@epm.com.co
      inference_output_path: "abfss://gold@azsaepmnpdatalakeg2.dfs.core.windows.net/Midas_agent_inference/dev"
      endpoint_workload_size: Small
      endpoint_scale_to_zero_enabled: true
      agent_llm_timeout_seconds: 60
      agent_max_iterations: 10
      db_user: SQL_EPMBOTPD05
      db_dsn: "epm-to34.corp.epm.com.co:1521/SFUAT"
      oracle_secret_scope: AZ-SecretScopeDBKS-EPM-NP-KV-DLLO
      db_password_secret_key: AZ-SECRET-EPM-BOTPD05-FACTURACION-CTATECNICA

  # -------------------- PRUEBAS (UAT) --------------------
