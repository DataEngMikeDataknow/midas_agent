  #   - Catálogo destino UAT: epm_datalake_catalog_np (espejo de epm_datalabs_catalog_dllo en DLLO)
  #   - Catálogo fuente UAT: epm_datalake_vol_np (lago compartido, solo lectura, igual que DLLO)
  #   - SP de UAT ya tiene permisos de creación de clusters → se usa new_cluster (sin cluster_id fijo)
  #   - Ambiente limpio: DABs crea jobs, cluster, modelo y endpoint desde cero
  uat:
