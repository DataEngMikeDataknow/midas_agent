[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "midas-agent"
version = "0.4.0"
description = "MIDAS agente de órdenes de calidad para Databricks"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["midas*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
