case_id: variacion_significativa_mes_anterior
name: Variación significativa contra el mes anterior
version: 0.1.0
owner_role: cientifico_datos

objective: >
  Analizar órdenes de calidad generadas por variación significativa de consumo
  frente al mes anterior para servicios de agua, energía y gas.

supported_services:
  - agua
  - energia
  - gas

decision_catalog:
  - SIN_NOVEDAD
  - REQUIERE_AJUSTE
  - REQUIERE_VISITA
  - REVISION_MANUAL

classification_catalog:
  - NORMAL
  - VARIACION_NO_JUSTIFICADA
  - PNO
  - ESTACIONALIDAD
  - OBRA_NUEVA
  - ERROR_LECTURA
  - CONSTANTE_MAL_CONFIGURADA
  - DATOS_INSUFICIENTES
  - ERROR_TECNICO

technical_status_catalog:
  - PROCESADA
  - ERROR_DATOS
  - ERROR_ENDPOINT
  - ERROR_TOOL
  - ERROR_VALIDACION_JSON
  - NO_SOPORTADA
  - PENDIENTE_REINTENTO

required_fields:
  - order_id
  - service_type
  - servicio_suscrito
  - id_periodo_actual
  - consumo_actual
  - consumo_anterior

recommended_features:
  - variacion_absoluta
  - variacion_porcentual
  - promedio_consumo_ultimos_3_periodos
  - promedio_consumo_ultimos_6_periodos
  - desviacion_consumo
  - lectura_estimada
  - lectura_corregida
  - reclamos_recientes
  - pno_activo
  - ordenes_previas

mandatory_rules:
  - No inventar datos.
  - Si falta consumo actual o consumo anterior, enviar a REVISION_MANUAL.
  - Si hay inconsistencia de datos que impide comparar periodos, enviar a REVISION_MANUAL.
  - Si technical_status es distinto de PROCESADA, business_decision debe ser null.
  - La salida debe ser JSON válido con el contrato definido.

interpretative_rules:
  - Evaluar si la variación se explica por estacionalidad, PNO, reclamos, obra nueva o lectura.
  - Evaluar si la variación parece normal contra el patrón histórico del producto.
  - Evaluar si la evidencia disponible es suficiente para una recomendación funcional.
