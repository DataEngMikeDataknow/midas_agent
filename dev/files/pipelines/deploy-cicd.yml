        DATABRICKS_TF_EXEC_PATH: /tmp/terraform_bin/terraform

# =============================================================================
# STAGE: Transform + Inferencia UAT (manual)
# Lanza midas_load_transform_data, que encadena inferencia al final.
# Para ejecutar: Run pipeline → doRunPipelineUAT=true
# =============================================================================
- stage: Run_Pipeline_UAT
  displayName: Run transform + inference in UAT (manual)
  dependsOn: []
  condition: |
    and(
      eq(variables['Build.Reason'], 'Manual'),
      eq(${{ parameters.doRunPipelineUAT }}, true)
    )
  jobs:
  - job: RunPipeline
    displayName: Run midas_load_transform_data (UAT)
    pool:
      name: Interno-Ubuntu20.04-VMSS
    steps:
    - checkout: self
      clean: true
    - script: |
        set -euo pipefail
        if ! command -v databricks >/dev/null 2>&1; then
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/v0.221.0/install.sh | sh
        fi
      displayName: 'Install Databricks CLI'
    - script: |
        set -euo pipefail
        TF_VERSION="1.9.8"
        TF_BIN="/tmp/terraform_bin/terraform"
