# =============================================================================
# PIPELINE DE DESPLIEGUE - MIDAS AGENT
# =============================================================================
# Pipelines configurados en Azure DevOps (proyecto EfiFact):
#
#   1. EFIFACT-MIDAS-General-IC  →  usa ESTE archivo (pipelines/deploy-cicd.yml)
#      Maneja los despliegues de Databricks Asset Bundles a cada ambiente.
#
#   2. Pipeline separado (azure-pipelines.yml)
#      Maneja BuildAndTest + SonarQube Quality Gate en cada push a feature/*.
#
# FLUJO DE TRABAJO:
#   feature/* → PR → desarrollo → PR (3 reviewers) → pruebas → PR → produccion
#
# NOTA: Si el pipeline falla en pruebas por un error de entorno (no de código),
#   puedes RE-EJECUTAR sin crear un nuevo PR:
#   Azure DevOps → Pipelines → EFIFACT-MIDAS-General-IC → run fallido → "Re-run failed jobs"
# =============================================================================

trigger:
  branches:
    include:
    - desarrollo
    - pruebas
    - produccion
    - feature/*

variables:
- group: databricks-MIDAS

parameters:
- name: doDeploy
  displayName: "Ejecutar despliegue a DEV"
  type: boolean
  default: false
- name: doDeployUAT
  displayName: "Ejecutar despliegue a UAT (manual)"
  type: boolean
  default: false
- name: doRunPipelineUAT
  displayName: "Ejecutar transform + inferencia en UAT (manual)"
  type: boolean
  default: false
- name: doRunInferenceUAT
  displayName: "Ejecutar solo inferencia en UAT (manual)"
  type: boolean
  default: false
- name: doRunPipelinePROD
  displayName: "Ejecutar transform + inferencia en PROD (manual)"
  type: boolean
  default: false
- name: doRunInferencePROD
  displayName: "Ejecutar solo inferencia en PROD (manual)"
  type: boolean
  default: false

stages:

# =============================================================================
# STAGE DEV: Solo se ejecuta manualmente desde la rama feature/* o desarrollo.
# Condición: trigger Manual + parámetro doDeploy=true
# Para ejecutar: Azure DevOps → Run pipeline → seleccionar rama → doDeploy=true
# =============================================================================
- stage: Deploy_Dev
  displayName: Deploy to DEV Databricks (Bundles)
  condition: |
    and(
      succeeded(),
      eq(variables['Build.Reason'], 'Manual'),
      eq(${{ parameters.doDeploy }}, true)
    )

  jobs:
  - job: Deploy
    displayName: Deploy bundle to DEV
    pool:
      name: Interno-Ubuntu20.04-VMSS
    steps:
    - checkout: self
      clean: true
      persistCredentials: true

    - script: |
        set -euo pipefail
        python3 --version || true
        pip3 --version || true
      displayName: 'Environment / Context'

    - script: |
        set -euo pipefail
        if ! command -v databricks >/dev/null 2>&1; then
          echo "Databricks CLI no está instalado. Instalando..."
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/v0.221.0/install.sh | sh
        else
          echo "Databricks CLI ya está instalado."
        fi
        databricks -v
      displayName: 'Install Databricks CLI'

    - script: |
        set -euo pipefail
        TF_VERSION="1.9.8"
        TF_BIN="/tmp/terraform_bin/terraform"
        if [ ! -f "${TF_BIN}" ]; then
          mkdir -p /tmp/terraform_bin
          curl -4 -fsSL "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" -o /tmp/terraform.zip
          unzip -o /tmp/terraform.zip -d /tmp/terraform_bin
          chmod +x "${TF_BIN}"
        fi
        "${TF_BIN}" version
      displayName: 'Install Terraform'

    - script: |
        rm -f ~/.databrickscfg
        mkdir -p ~/.databricks
      displayName: 'Clean Databricks Config'

    - script: |
        set -euo pipefail
        echo "Testing Databricks connection..."
        databricks current-user me
      displayName: 'Test Databricks Connection'
      env:
        DATABRICKS_HOST: $(DEV_DATABRICKS_HOST)
        DATABRICKS_CLIENT_ID: $(DEV_AZURE_SP_APPLICATION_ID)
        DATABRICKS_CLIENT_SECRET: $(DEV_AZURE_SP_CLIENT_SECRET)
        DATABRICKS_AZURE_TENANT_ID: $(AZURE_TENANT_ID)

    - script: |
        set -euo pipefail
        databricks bundle validate -t dev
      workingDirectory: $(Build.SourcesDirectory)
      displayName: 'Validate bundle (dev)'
      env:
        DATABRICKS_HOST: $(DEV_DATABRICKS_HOST)
        DATABRICKS_CLIENT_ID: $(DEV_AZURE_SP_APPLICATION_ID)
        DATABRICKS_CLIENT_SECRET: $(DEV_AZURE_SP_CLIENT_SECRET)
        DATABRICKS_AZURE_TENANT_ID: $(AZURE_TENANT_ID)
        DATABRICKS_TF_EXEC_PATH: /tmp/terraform_bin/terraform

    - script: |
        set -euo pipefail
        databricks bundle deploy -t dev
      workingDirectory: $(Build.SourcesDirectory)
      displayName: 'Deploy bundle (dev)'
      env:
        DATABRICKS_HOST: $(DEV_DATABRICKS_HOST)
        DATABRICKS_CLIENT_ID: $(DEV_AZURE_SP_APPLICATION_ID)
        DATABRICKS_CLIENT_SECRET: $(DEV_AZURE_SP_CLIENT_SECRET)
        DATABRICKS_AZURE_TENANT_ID: $(AZURE_TENANT_ID)
        DATABRICKS_TF_EXEC_PATH: /tmp/terraform_bin/terraform

    - script: |
        set -euo pipefail
        echo "Ejecutando job de deploy del agente en DEV..."
        databricks bundle run midas_agent_deploy_ops -t dev
      workingDirectory: $(Build.SourcesDirectory)
      displayName: 'Run midas_agent_deploy_ops (dev)'
      env:
        DATABRICKS_HOST: $(DEV_DATABRICKS_HOST)
        DATABRICKS_CLIENT_ID: $(DEV_AZURE_SP_APPLICATION_ID)
        DATABRICKS_CLIENT_SECRET: $(DEV_AZURE_SP_CLIENT_SECRET)
        DATABRICKS_AZURE_TENANT_ID: $(AZURE_TENANT_ID)
        DATABRICKS_TF_EXEC_PATH: /tmp/terraform_bin/terraform

# =============================================================================
# STAGE UAT: Se ejecuta automáticamente cuando código llega a rama 'pruebas'.
# También puede ejecutarse manualmente desde cualquier rama con doDeployUAT=true
# para validar cambios de pipeline sin necesitar PR a pruebas en cada intento.
# Auth: Managed Identity del agent pool Interno-Ubuntu20.04-VMSS (azure-msi).
# =============================================================================
- stage: Deploy_UAT
  displayName: Deploy to UAT Databricks (Bundles)
  dependsOn: []
  condition: |
    or(
      and(
        eq(variables['Build.SourceBranchName'], 'pruebas'),
        eq(variables['Build.Reason'], 'IndividualCI')
      ),
      and(
        eq(variables['Build.Reason'], 'Manual'),
        eq(${{ parameters.doDeployUAT }}, true)
      )
