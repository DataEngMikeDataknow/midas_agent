  jobs:
  - job: Deploy
    displayName: Deploy bundle to UAT
    pool:
      name: Interno-Ubuntu20.04-VMSS
    steps:
    - checkout: self
      clean: true
      persistCredentials: true

    - script: |
        set -euo pipefail
        python3 --version || true
        pip3 --version || true
      displayName: 'Environment / Context'

    - script: |
        set -euo pipefail
        if ! command -v databricks >/dev/null 2>&1; then
          echo "Databricks CLI no está instalado. Instalando..."
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/v0.221.0/install.sh | sh
        else
          echo "Databricks CLI ya está instalado."
        fi
        databricks -v
      displayName: 'Install Databricks CLI'

    - script: |
        set -euo pipefail
        TF_VERSION="1.9.8"
        TF_BIN="/tmp/terraform_bin/terraform"
        if [ ! -f "${TF_BIN}" ]; then
          mkdir -p /tmp/terraform_bin
          curl -4 -fsSL "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" -o /tmp/terraform.zip
          unzip -o /tmp/terraform.zip -d /tmp/terraform_bin
          chmod +x "${TF_BIN}"
        fi
        "${TF_BIN}" version
      displayName: 'Install Terraform'

    - script: |
        rm -f ~/.databrickscfg
      displayName: 'Clean Databricks Config'

    - script: |
        set -euo pipefail
        databricks bundle validate -t uat
      workingDirectory: $(Build.SourcesDirectory)
      displayName: 'Validate bundle (uat)'
      env:
        DATABRICKS_HOST: $(UAT_DATABRICKS_HOST)
        DATABRICKS_CLIENT_ID: $(UAT_AZURE_SP_APPLICATION_ID)
        DATABRICKS_CLIENT_SECRET: $(UAT_AZURE_SP_CLIENT_SECRET)
        DATABRICKS_AZURE_TENANT_ID: $(AZURE_TENANT_ID)
        DATABRICKS_TF_EXEC_PATH: /tmp/terraform_bin/terraform

    - script: |
        set -euo pipefail
        databricks bundle deploy -t uat
      workingDirectory: $(Build.SourcesDirectory)
      displayName: 'Deploy bundle (uat)'
      env:
        DATABRICKS_HOST: $(UAT_DATABRICKS_HOST)
        DATABRICKS_CLIENT_ID: $(UAT_AZURE_SP_APPLICATION_ID)
        DATABRICKS_CLIENT_SECRET: $(UAT_AZURE_SP_CLIENT_SECRET)
        DATABRICKS_AZURE_TENANT_ID: $(AZURE_TENANT_ID)
        DATABRICKS_TF_EXEC_PATH: /tmp/terraform_bin/terraform

    - script: |
        set -euo pipefail
        echo "Ejecutando job de deploy del agente en UAT..."
        databricks bundle run midas_agent_deploy_ops -t uat
      workingDirectory: $(Build.SourcesDirectory)
      displayName: 'Run midas_agent_deploy_ops (uat)'
      env:
        DATABRICKS_HOST: $(UAT_DATABRICKS_HOST)
        DATABRICKS_CLIENT_ID: $(UAT_AZURE_SP_APPLICATION_ID)
        DATABRICKS_CLIENT_SECRET: $(UAT_AZURE_SP_CLIENT_SECRET)
        DATABRICKS_AZURE_TENANT_ID: $(AZURE_TENANT_ID)
        DATABRICKS_TF_EXEC_PATH: /tmp/terraform_bin/terraform

# =============================================================================
# STAGE PROD: Se ejecuta automáticamente cuando código llega a rama 'produccion'.
# Credenciales: PROD_* del variable group databricks-MIDAS
# SP: 1db15634-31b7-4f92-a976-fc8920216152 (PROD_AZURE_SP_APPLICATION_ID)
# =============================================================================
