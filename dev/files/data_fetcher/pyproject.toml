# pyproject.toml

[project]
name = "midas_extractor"
version = "1.0.0"
description = "Proyecto para extraer datos del agente midas y guardarlos como Parquet."
requires-python = ">=3.11"

dependencies = [
    "pandas",
    "pyarrow",
    "oracledb",
    "python-dotenv",
    "tqdm",
    "fastparquet",
    "matplotlib",
    "ipykernel",
]