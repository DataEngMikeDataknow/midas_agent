trigger:
  branches:
    include:
      - desarrollo
      - feature/*

variables:
  - name: SONAR_PROJECT_KEY
    value: 'midas-agent'
  - name: DATABRICKS_BUNDLE_NAME
    value: 'midas_agent'

stages:
- stage: BuildAndTest
  displayName: 'Build, Unit Tests and Quality Gate'
  jobs:
  - job: Test
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.10'

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt
      displayName: 'Install dependencies'

    - task: SonarQubePrepare@6
      displayName: 'Prepare SonarQube analysis'
      inputs:
        SonarQube: 'sonar-epm-produccion-EficienCX'
        scannerMode: 'CLI'
        configMode: 'manual'
        cliProjectKey: '$(SONAR_PROJECT_KEY)'
        cliProjectName: 'midas-agent'
        extraProperties: |
          sonar.python.version=3
          sonar.sources=src
          sonar.tests=tests
          sonar.python.coverage.reportPaths=coverage.xml

    - script: |
        export PYTHONPATH=$PYTHONPATH:.:src
        pytest tests/ --doctest-modules --junitxml=junit/test-results.xml --cov=src --cov-report=xml --cov-report=html
      displayName: 'Run unit tests with coverage'

    - task: PublishTestResults@2
      condition: succeededOrFailed()
      inputs:
        testResultsFiles: '**/test-*.xml'
        testRunTitle: 'Publish test results'

    - task: PublishCodeCoverageResults@2
      inputs:
        summaryFileLocation: '$(System.DefaultWorkingDirectory)/**/coverage.xml'

    - task: SonarQubeAnalyze@6
      displayName: 'Run SonarQube analysis'

    - task: SonarQubePublish@6
      displayName: 'Publish SonarQube Quality Gate result'
      inputs:
        pollingTimeoutSec: '300'

- stage: DeployDev
  displayName: 'Deploy Bundle to Dev (Databricks)'
  dependsOn: BuildAndTest
  condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'))
  variables:
    - group: databricks-MIDAS
  jobs:
  - job: DeployBundle
    displayName: Deploy bundle to DEV
    pool:
      name: Interno-Ubuntu20.04-VMSS
    steps:
    - checkout: self
      clean: true
      persistCredentials: true

    - script: |
        set -euo pipefail
        if ! command -v databricks >/dev/null 2>&1; then
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/v0.221.0/install.sh | sh
        fi
        databricks -v
      displayName: 'Install Databricks CLI'

    - script: |
        rm -f ~/.databrickscfg
        mkdir -p ~/.databricks
      displayName: 'Clean Databricks Config'

    - script: |
        set -euo pipefail
        databricks bundle validate -t dev
      workingDirectory: $(Build.SourcesDirectory)
      displayName: 'Validate bundle (dev)'
      env:
        DATABRICKS_HOST: $(DEV_DATABRICKS_HOST)
        DATABRICKS_CLIENT_ID: $(DEV_AZURE_SP_APPLICATION_ID)
        DATABRICKS_CLIENT_SECRET: $(DEV_AZURE_SP_CLIENT_SECRET)
        DATABRICKS_AZURE_TENANT_ID: $(AZURE_TENANT_ID)

    - script: |
        set -euo pipefail
        databricks bundle deploy -t dev
      workingDirectory: $(Build.SourcesDirectory)
      displayName: 'Deploy bundle (dev)'
      env:
        DATABRICKS_HOST: $(DEV_DATABRICKS_HOST)
        DATABRICKS_CLIENT_ID: $(DEV_AZURE_SP_APPLICATION_ID)
        DATABRICKS_CLIENT_SECRET: $(DEV_AZURE_SP_CLIENT_SECRET)
        DATABRICKS_AZURE_TENANT_ID: $(AZURE_TENANT_ID)
