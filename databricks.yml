                  oracle_jdbc_jar_path: ${var.oracle_jdbc_jar_path}
                  output_path: "/Volumes/${var.source_catalog}/${var.source_schema}/${var.source_volume}/${var.source_base_path}"
                  control_catalog: ${var.catalog_destino}
                  control_schema: ${var.schema_destino}
                  job_name: midas_bronze
            - task_key: actualizar_ordenes_calidad
              depends_on:
                - task_key: extraer_datos_oracle
              job_cluster_key: midas_cluster
              # Parquet -> Bronze con insertInto(overwrite=True): idempotente.
              timeout_seconds: 3600
              max_retries: 2
              min_retry_interval_millis: 60000
              retry_on_timeout: false
              spark_python_task:
                python_file: ./src/midas/main_ingestion.py
                parameters:
                  - "--source_catalog"
                  - "${var.source_catalog}"
                  - "--source_schema"
                  - "${var.source_schema}"
                  - "--source_volume"
                  - "${var.source_volume}"
                  - "--source_base_path"
                  - "${var.source_base_path}"
                  - "--destination_catalog"
                  - "${var.catalog_destino}"
                  - "--destination_schema"
                  - "${var.schema_destino}"
                  - "--control_catalog"
                  - "${var.catalog_destino}"
                  - "--control_schema"
                  - "${var.schema_destino}"
                  - "--job_name"
                  - "midas_bronze"
            - task_key: bronze_to_silver
              depends_on:
                - task_key: actualizar_ordenes_calidad
              job_cluster_key: midas_cluster
              # DDL + INSERT OVERWRITE + vistas: idempotente. La verificacion previa
              # aborta antes de tocar datos si falta un .sql.
              timeout_seconds: 3600
              max_retries: 1
              min_retry_interval_millis: 60000
              retry_on_timeout: false
              spark_python_task:
                python_file: ./src/midas/main_transform.py
                parameters:
                  - "--catalog"
                  - "${var.catalog_destino}"
                  - "--schema"
                  - "${var.schema_destino}"
                  # Plano de control de Silver: job_name lo separa del de Bronze en las
                  # mismas midas_control_cargas / midas_log_cargas.
                  - "--control_catalog"
                  - "${var.catalog_destino}"
                  - "--control_schema"
                  - "${var.schema_destino}"
                  - "--job_name"
                  - "midas_silver"

        # Job de diagnóstico on-demand (patrón alineado con vera_framework).
        # Solo en uat/pdn, donde la red hacia Oracle es el riesgo (en dllo no
        # es necesario). Sin schedule: se lanza a mano para aislar fallos de
        # red/credenciales/listener antes de correr la cadena.
        midas_check_conectividad:
          name: midas_check_conectividad_${bundle.target}
          permissions:
            - level: CAN_MANAGE
              user_name: frans.taboada@epm.com.co
          job_clusters:
            - job_cluster_key: midas_cluster
              new_cluster:
                spark_version: ${var.spark_version}       # 16.4 = JDK 17 (I4)
                node_type_id: ${var.node_type_id}
                num_workers: ${var.num_workers}
                data_security_mode: SINGLE_USER            # requerido para JPype/JVM (I5)
                single_user_name: ${var.service_principal}
          tasks:
            - task_key: check
              job_cluster_key: midas_cluster
              # Diagnostico de conectividad: CERO reintentos. Si falla, el fallo ES el
              # resultado que se buscaba; reintentar solo oculta el sintoma.
              timeout_seconds: 900
              max_retries: 0
              min_retry_interval_millis: 60000
              retry_on_timeout: false
              notebook_task:
                notebook_path: ./notebooks/check_conectividad_oracle.py
                base_parameters:
                  oracle_host: ${var.oracle_host}
                  oracle_port: ${var.oracle_port}
                  oracle_service: ${var.oracle_service}
                  oracle_user: ${var.oracle_user}
                  oracle_secret_scope: ${var.oracle_secret_scope}
                  oracle_password_key: ${var.oracle_password_key}
                  oracle_jdbc_jar_path: ${var.oracle_jdbc_jar_path}
