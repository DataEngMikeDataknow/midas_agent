                  - "${var.oracle_secret_scope}"
                  - "--db_password_secret_key"
                  - "${var.oracle_password_key}"
                  - "--oracle_jdbc_jar_path"
                  - "${var.oracle_jdbc_jar_path}"
                  - "--output_path"
                  - "/Volumes/${var.source_catalog}/${var.source_schema}/${var.source_volume}/${var.source_base_path}"
                  - "--control_catalog"
                  - "${var.catalog_destino}"
                  - "--control_schema"
                  - "${var.schema_destino}"
                  - "--job_name"
                  - "midas_bronze"
            - task_key: actualizar_ordenes_calidad
              depends_on:
                - task_key: extraer_datos_oracle
              job_cluster_key: midas_cluster
              spark_python_task:
                python_file: ./src/midas/main_ingestion.py
                parameters:
                  - "--source_catalog"
                  - "${var.source_catalog}"
                  - "--source_schema"
                  - "${var.source_schema}"
                  - "--source_volume"
                  - "${var.source_volume}"
                  - "--source_base_path"
                  - "${var.source_base_path}"
                  - "--destination_catalog"
                  - "${var.catalog_destino}"
                  - "--destination_schema"
                  - "${var.schema_destino}"
                  - "--control_catalog"
                  - "${var.catalog_destino}"
                  - "--control_schema"
                  - "${var.schema_destino}"
                  - "--job_name"
                  - "midas_bronze"
            - task_key: bronze_to_silver
