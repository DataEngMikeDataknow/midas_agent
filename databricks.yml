# =============================================================================
# midas_data_platform — Bundle de INGENIERÍA DE DATOS del proyecto MIDAS (EPM)
# =============================================================================
# Responsabilidad EXCLUSIVA de este bundle: la cadena de datos
#   Oracle → Parquet (Volume UC) → Bronze → Silver (schema `facturacion`).
#
# El AGENTE (serving, deploy MLOps, inferencia batch) vive en el bundle
# `midas_agent`. Este repo ya NO contiene nada del agente.
#
# Contrato entre bundles:
#   - Este bundle PRODUCE las tablas Silver que el agente CONSUME.
#   - La cadena corre a las 07:00 America/Bogota (extracción ~30 min +
#     bronze ~5 min + silver ~5 min → termina antes de las 08:00).
#   - La inferencia del agente (bundle midas_agent) debe correr DESPUÉS de
#     ~08:00, o validar `midas_log_cargas` (estado EXITOSO de la corrida del
#     día) antes de arrancar. No hay acoplamiento directo de jobs entre bundles.
#
# Conexión a Oracle: JDBC ojdbc11 vía JayDeBeApi + JPype1 (driver-side).
# Ver README.md ("Conexión a Oracle") y src/midas/db/database.py.
# =============================================================================

bundle:
  name: midas_data_platform

# Nada de artifacts: ningún job consume un wheel; los paquetes del repo se
# resuelven vía sys.path dentro de cada runner (patrón BUG-001).

sync:
  exclude:
    - "**/__pycache__/**"
    - "**/*.pyc"
    - "dist/**"
    - ".databricks/**"
    - "pipeline/**"
    - "tests/**"

# -----------------------------------------------------------------------------
# VARIABLES GLOBALES (declaración obligatoria — I7: declaración + valor por
# target + paso explícito como ${var.x} donde se usa; si falta una pieza llega
# vacía y NO falla el deploy, falla en runtime).
# -----------------------------------------------------------------------------
variables:
  catalog_destino:
    description: Catálogo Unity Catalog destino (Bronze/Silver y tablas de control).
  schema_destino:
    description: Schema destino dentro del catálogo (facturacion).
  source_catalog:
    description: Catálogo del Volume UC donde se escriben/leen los Parquet fuente.
  source_schema:
    description: Schema del Volume UC fuente.
  source_volume:
    description: Nombre del Volume donde se materializan los Parquet.
  source_base_path:
    description: Carpeta base dentro del Volume para los Parquet de esta cadena.
  oracle_host:
    description: Host del listener Oracle.
  oracle_port:
    description: Puerto del listener Oracle.
  oracle_service:
    description: Service name Oracle.
  oracle_user:
    description: Usuario Oracle (va explícito, NO está en el secret scope — I9).
  oracle_secret_scope:
    description: Databricks Secret Scope que contiene la contraseña de Oracle.
  oracle_password_key:
    description: Clave dentro del Secret Scope con la contraseña de Oracle.
  oracle_jdbc_jar_path:
    description: >-
      Ruta /Volumes/... del jar ojdbc11 (debe coincidir carácter por carácter
      con la ubicación real en el Volume — I6). El SP necesita READ VOLUME.
  pause_schedule:
    description: Estado del schedule del job (PAUSED / UNPAUSED).
  service_principal:
    description: Application ID del Service Principal que ejecuta el job.
  cluster_id:
    description: ID del cluster compartido existente (solo dllo; el SP no puede crear clusters).
    default: ""
  spark_version:
    description: DBR de los job clusters efímeros (uat/pdn). 16.4 = JDK 17, empatado con ojdbc11 (I4).
    default: ""
  node_type_id:
    description: Tipo de nodo de los job clusters efímeros (uat/pdn).
    default: ""
  num_workers:
    description: Número de workers de los job clusters efímeros (uat/pdn).
    default: "0"

targets:
  # ------------------------------- DESARROLLO (dllo) -------------------------
  dllo:
    mode: production
    default: true
    workspace:
      host: https://adb-1161217326944529.9.azuredatabricks.net
      root_path: /Shared/bundles/${bundle.name}/${bundle.target}
    # Versión final por pipeline: el job corre como el Service Principal (SP→SP).
    # Workaround conocido para deploy LOCAL como mpalomin@contratista.epm.co:
    # si el deploy da 403 PERMISSION_DENIED, COMENTA el service_principal_name
    # de abajo y DESCOMENTA el user_name. REVERTIR antes de merge (por pipeline
    # el deploy es SP→SP y este workaround no hace falta).
    run_as:
      service_principal_name: ${var.service_principal}
      # user_name: mpalomin@contratista.epm.co
    variables:
      catalog_destino: epm_datalabs_catalog_dllo
      schema_destino: facturacion
      source_catalog: epm_datalake_vol_np
      source_schema: facturacion_vol
      source_volume: facturacion_bronze_vol
      source_base_path: midas_agent
      oracle_host: epm-to34.corp.epm.com.co
      oracle_port: "1521"
      oracle_service: SFUAT
      oracle_user: SQL_EPMBOTPD05
      oracle_secret_scope: AZ-SecretScopeDBKS-EPM-NP-KV-DLLO
      oracle_password_key: AZ-SECRET-EPM-BOTPD05-FACTURACION-CTATECNICA
      oracle_jdbc_jar_path: /Volumes/epm_datalake_vol_np/facturacion_vol/facturacion_bronze_vol/_oracle_client/ojdbc11-23.26.2.0.0.jar
      pause_schedule: PAUSED
      service_principal: 2080d313-3074-4adf-8265-916ef7645dc2
      cluster_id: 0722-211855-e1a090ph
    resources:
      jobs:
        midas_bronze_silver:
          name: midas_bronze_silver_${bundle.target}
          permissions:
            - level: CAN_MANAGE
              user_name: frans.taboada@epm.com.co
            - level: CAN_MANAGE_RUN
              user_name: mpalomin@contratista.epm.co
          schedule:
            quartz_cron_expression: "0 0 7 * * ?"
            timezone_id: America/Bogota
            pause_status: ${var.pause_schedule}
          email_notifications:
            on_success:
              - jonatan.londono@epm.com.co
              - mpalomin@contratista.epm.co
              - jcordori@contratista.epm.co
            on_failure:
              - jonatan.londono@epm.com.co
              - mpalomin@contratista.epm.co
              - jcordori@contratista.epm.co
          tags:
            Area: Facturación
            Gerencia: Gerencia experiencia usuario cliente
          queue:
            enabled: true
          # dllo corre sobre el cluster compartido (existing_cluster_id): el SP
          # no puede crear clusters.
          # NINGÚN target declara `libraries`: por restricción de plataforma EPM no
          # se pueden instalar libs a nivel de cluster (alineado con vera_framework,
          # que tampoco declara `libraries` en ningún target). El driver Oracle
          # (JayDeBeApi + JPype1) se instala por `%pip` en la primera celda del
          # notebook `10_extraer_datos_oracle.py` — único mecanismo validado en
          # producción. Por eso la extracción es notebook_task y no spark_python_task.
          tasks:
            # Primera task (patrón alineado con vera_framework): crea/siembra de
            # forma idempotente el plano de control. No usa Oracle → sin libraries.
            - task_key: crear_objetos
              existing_cluster_id: ${var.cluster_id}
              # TIMEOUTS Y REINTENTOS (F09). Antes no habia ninguno: una llamada
              # colgada a Oracle retenia el driver indefinidamente y un corte de red
              # transitorio tumbaba la cadena diaria completa.
              #
              # retry_on_timeout: false en TODAS: un timeout significa que algo esta
              # atascado, y reintentar a ciegas duplica el dano en vez de resolverlo.
              # Los reintentos son para fallos transitorios, no para cuelgues.
              # Metadata: MERGE, CREATE IF NOT EXISTS y ALTER guardados. Idempotente,
              # asi que reintentar es seguro y barato.
              timeout_seconds: 1800
              max_retries: 2
              min_retry_interval_millis: 60000
              retry_on_timeout: false
              notebook_task:
                notebook_path: ./notebooks/00_creacion_objetos_midas.py
                base_parameters:
                  catalog_destino: ${var.catalog_destino}
                  schema_destino: ${var.schema_destino}
            # notebook_task: el driver JDBC se instala por %pip en la 1a celda.
            - task_key: extraer_datos_oracle
              depends_on:
                - task_key: crear_objetos
              existing_cluster_id: ${var.cluster_id}
              # 3h: es la task larga (una query por instalacion/servicio/cuenta contra
              # Oracle). UN solo reintento: repetir una extraccion de horas es caro y,
              # si Oracle esta caido, el segundo intento tampoco va a funcionar.
              timeout_seconds: 10800
              max_retries: 1
              min_retry_interval_millis: 60000
              retry_on_timeout: false
              notebook_task:
                notebook_path: ./notebooks/10_extraer_datos_oracle.py
                base_parameters:
                  db_user: ${var.oracle_user}
                  db_dsn: "${var.oracle_host}:${var.oracle_port}/${var.oracle_service}"
                  secret_scope: ${var.oracle_secret_scope}
                  db_password_secret_key: ${var.oracle_password_key}
                  oracle_jdbc_jar_path: ${var.oracle_jdbc_jar_path}
                  output_path: "/Volumes/${var.source_catalog}/${var.source_schema}/${var.source_volume}/${var.source_base_path}"
                  control_catalog: ${var.catalog_destino}
                  control_schema: ${var.schema_destino}
                  job_name: midas_bronze
            - task_key: actualizar_ordenes_calidad
              depends_on:
                - task_key: extraer_datos_oracle
              existing_cluster_id: ${var.cluster_id}
              # Parquet -> Bronze con insertInto(overwrite=True): idempotente.
              timeout_seconds: 3600
              max_retries: 2
              min_retry_interval_millis: 60000
              retry_on_timeout: false
              spark_python_task:
                python_file: ./src/midas/main_ingestion.py
                parameters:
                  - "--source_catalog"
                  - "${var.source_catalog}"
                  - "--source_schema"
                  - "${var.source_schema}"
                  - "--source_volume"
                  - "${var.source_volume}"
                  - "--source_base_path"
                  - "${var.source_base_path}"
                  - "--destination_catalog"
                  - "${var.catalog_destino}"
                  - "--destination_schema"
                  - "${var.schema_destino}"
                  - "--control_catalog"
                  - "${var.catalog_destino}"
                  - "--control_schema"
                  - "${var.schema_destino}"
                  - "--job_name"
                  - "midas_bronze"
            - task_key: bronze_to_silver
              depends_on:
                - task_key: actualizar_ordenes_calidad
              existing_cluster_id: ${var.cluster_id}
              # DDL + INSERT OVERWRITE + vistas: idempotente. La verificacion previa
              # aborta antes de tocar datos si falta un .sql.
              timeout_seconds: 3600
              max_retries: 1
              min_retry_interval_millis: 60000
              retry_on_timeout: false
              spark_python_task:
                python_file: ./src/midas/main_transform.py
                parameters:
                  - "--catalog"
                  - "${var.catalog_destino}"
                  - "--schema"
                  - "${var.schema_destino}"
                  # Plano de control de Silver: job_name lo separa del de Bronze en las
                  # mismas midas_control_cargas / midas_log_cargas.
                  - "--control_catalog"
                  - "${var.catalog_destino}"
                  - "--control_schema"
                  - "${var.schema_destino}"
                  - "--job_name"
                  - "midas_silver"

